<!DOCTYPE html>
<html>
    <head>
        <title>Variabel JavaScript</title>
    </head> 
    <body>
        <h2>Program Pengenalan Variabel JavaScript</h2>
    <script>
        // Membuat Variabel
        let nama = "Djovita Asmara";
        let umur = 19;
        let tinggi = 163;
        let sudahmenikah = false;
        
        // Menampilkan nilai dan tipe variabel
        document.write("Nama :" + nama +"| Tipe :" + typeof nama + "<br>");
        document.write("Umur :" + umur +"| Tipe :" + typeof umur + "<br>");
        document.write("Tinggi :" + tinggi +"| Tipe :" + typeof tinggi + "<br>");
        document.write("Sudah Menikah :" + sudahmenikah +"| Tipe :" + typeof sudahmenikah + "<br>");
    </script>
    </body>
</html>
